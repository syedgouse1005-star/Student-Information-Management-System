
<!DOCTYPE html>
<html lang="en">
    
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0a3d62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Student Info">

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/static/service-worker.js")
        .catch((error) => console.error("Service worker registration failed:", error));
    });
  }
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | Student Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 5px 20px #0001;
            width: 320px;
        }
        h1 { color: #1565c0; font-size: 24px; }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
        }
        input {
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background: #1565c0;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .error { color: #c62828; }
        .app-logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    display: block;
    margin: 0 auto 15px;
}
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand .app-logo {
    width: 60px;
    height: 60px;
    margin: 0;
    flex-shrink: 0;
}

.brand p {
    font-size: 14px;
    font-weight: bold;
    margin: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 15px;
}

.dashboard-logo {
    display: block;
    width: 30px !important;
    height: 30px !important;
    max-width: 30px !important;
    max-height: 30px !important;
    object-fit: contain;
    flex: 0 0 30px;
}

.brand h2 {
    margin-top: 0;
}

    </style>
</head>
<body>
    <div class="login-box">
        <img src="{{ url_for('static', filename='logo.png') }}"
         alt="Logo"
         class="app-logo">
    
    <!-- Your existing login heading and form stay here -->
        <div class="brand">

    <p>Student Information Management System</p>
</div>

<h1>Admin Login</h1>

        {% for category, message in get_flashed_messages(with_categories=true) %}
            <p class="error">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            <input name="username" placeholder="Admin username" required>
            <input name="password" type="password"
                   placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
